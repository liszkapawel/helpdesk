services:
  php:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
      - uploads:/var/www/html/public/uploads
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://app:${MYSQL_PASSWORD}@database:3306/helpdesk?serverVersion=8.0&charset=utf8mb4"
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: '^https?://(.+\.)?ticketerr\.cc$$'
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www/html
      - ./api/docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/var/www/frontend
      - uploads:/var/www/html/public/uploads
    depends_on:
      - php
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_DOMAIN: ticketerr.cc
    volumes:
      - frontend_dist:/dist

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw

  mailer:
    image: axllent/mailpit
    restart: unless-stopped

volumes:
  database_data:
  frontend_dist:
  uploads:
